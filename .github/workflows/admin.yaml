name: Admin

env:
    EXTENSION_NAME: ${{ github.event.repository.name }}

on:
    workflow_dispatch:
    push:
        branches:
            - trunk
    pull_request:
        paths:
            - '*.md'
            - src/Resources/app/administration/**
            - tests/Jest/**
            - tests/acceptance/**
            - tests/migration-proof/**
            - .github/**/*.yml
            - .github/**/*.yaml

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        uses: ./.github/workflows/action-lint.yml
        with:
            extension_name: ${{ github.event.repository.name }}
            run_admin: true

    jest:
        name: Jest
        uses: ./.github/workflows/action-jest.yml
        with:
            extension_name: ${{ github.event.repository.name }}
