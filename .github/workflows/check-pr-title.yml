name: Check PR title

on:
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

permissions:
    pull-requests: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # 6.1.1
              with:
                  types: |
                      feat
                      fix
                      chore
                      docs
                      style
                      refactor
                      perf
                      test
                      build
                      ci
                      revert
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
