name: Integration

env:
    EXTENSION_NAME: ${{ github.event.repository.name }}
    PLATFORM_BRANCH: trunk

on:
    workflow_dispatch:
    push:
        branches:
            - trunk
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    danger:
        name: Danger Check
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
              with:
                  php-version: 8.2
                  extensions: ctype, intl, mbstring
                  coverage: none

            - name: Install Danger
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
              with:
                  working-directory: vendor-bin/danger-php

            - name: Run Danger PHP
              run: vendor-bin/danger-php/vendor/bin/danger ci
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}

    build_zip:
        name: Build and validate zip
        runs-on: ubuntu-latest
        steps:
            - name: Build
              uses: shopware/github-actions/build-zip@main
              with:
                  extensionName: ${{ env.EXTENSION_NAME }}

    phpunit:
        name: PHPUnit
        uses: ./.github/workflows/action-phpunit.yml
        with:
            extension_name: ${{ github.event.repository.name }}
            platform_branch: trunk
            coverage: true
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    smoke_test:
        name: Smoke test
        runs-on: ubuntu-latest
        steps:
            - name: Setup extension
              uses: shopware/github-actions/setup-extension@main
              with:
                  extensionName: ${{ env.EXTENSION_NAME }}
                  shopwareVersion: ${{ env.PLATFORM_BRANCH }}
                  install: true
                  install-admin: true
                  install-storefront: true
                  extraRepositories: |
                      {
                        "${{ env.EXTENSION_NAME }}": {
                          "type": "path",
                          "url": "custom/plugins/${{ env.EXTENSION_NAME }}",
                          "symlink": true
                        }
                      }

            - name: Uninstall Plugin
              run: php bin/console plugin:uninstall ${{ env.EXTENSION_NAME }}
