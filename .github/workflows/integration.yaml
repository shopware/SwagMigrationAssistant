name: Integration

on:
  workflow_dispatch:
  push:
    branches:
      - trunk
  pull_request:

jobs:
  danger:
    runs-on: ubuntu-latest
    if: ${{ !github.event.act }}
    steps:
      - name: Clone
        uses: actions/checkout@v1

      - name: Danger
        uses: shyim/danger-php@0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PULL_REQUEST_ID: ${{ github.event.pull_request.number }}

  build_zip:
    name: Build and validate zip
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: shopware/github-actions/build-zip@main
        with:
          extensionName: ${{ github.event.repository.name }}

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        PLATFORM_BRANCH: ["v6.6.1.0", "trunk"]
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          shopwareVersion: ${{ matrix.PLATFORM_BRANCH }}
          extraRepositories: |
            {
              "${{ github.event.repository.name }}": {
                "type": "path",
                "url": "custom/plugins/${{ github.event.repository.name }}",
                "symlink": true
              }
            }
      - name: Clone TestData
        working-directory: custom/plugins/${{ github.event.repository.name }}/tests
        run: |
          # TODO: As soon as the TestData gets migrated to GH use octo-sts
          git clone https://${{ secrets.TESTDATA_CLONE_TOKEN }}@gitlab.shopware.com/shopware/6/services/testdata.git testData
          mysql -uroot < testData/Migration/sw55.sql
      - name: Run PHPUnit
        working-directory: custom/plugins/${{ github.event.repository.name }}
        run: php -d pcov.enabled=1 -d pcov.directory=${PWD} -d pcov.exclude='~(vendor|tests|node_modules)~' ${GITHUB_WORKSPACE}/vendor/bin/phpunit --configuration phpunit.xml.dist

  smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          install-admin: true
          install-storefront: true
          extraRepositories: |
            {
              "${{ github.event.repository.name }}": {
                "type": "path",
                "url": "custom/plugins/${{ github.event.repository.name }}",
                "symlink": true
              }
            }
      - name: Uninstall Plugin
        run: php bin/console plugin:uninstall ${{ github.event.repository.name }}

  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        PLATFORM_BRANCH: ["v6.6.1.0", "trunk"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopware
        ports:
          - 3306:3306
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/shopware
    steps:
      - uses: shopware/github-actions/setup-extension@main
        with:
          extensionName: ${{ github.event.repository.name }}
          install: true
          install-admin: true
          install-storefront: true
          mysqlVersion: skip
          env: prod
          extraRepositories: |
            {
              "${{ github.event.repository.name }}": {
                "type": "path",
                "url": "custom/plugins/${{ github.event.repository.name }}",
                "symlink": true
              }
            }
      - name: Setup Migration Assistant
        run: |
          composer run build:js:admin
          cd custom/plugins/${{ github.event.repository.name }}/tests
          # TODO: As soon as the TestData gets migrated to GH use octo-sts
          git clone https://${{ secrets.TESTDATA_CLONE_TOKEN }}@gitlab.shopware.com/shopware/6/services/testdata.git testData
          mysql -uroot < testData/Migration/sw55.sql
      - name: Install playwright
        working-directory: custom/plugins/${{ github.event.repository.name }}/tests/acceptance
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Run Playwright
        working-directory: custom/plugins/${{ github.event.repository.name }}/tests/acceptance
        run: |
          npx playwright test --workers=1
