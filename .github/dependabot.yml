version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 7
      reviewers:
          - 'shopware/product-cc-after-sales'
      commit-message:
          prefix: 'chore'
      groups:
          github-actions:
              patterns:
                  - '*'
    - package-ecosystem: 'composer'
      directory: '/vendor-bin/danger-php'
      schedule:
          interval: 'weekly'
      cooldown:
          default-days: 7
      reviewers:
          - 'shopware/product-cc-after-sales'
      commit-message:
          prefix: 'chore'
