version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
          time: '06:00'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 7
      reviewers:
          - 'shopware/product-cc-after-sales'
      commit-message:
          prefix: 'chore'
      groups:
          github-actions:
              patterns:
                  - '*'

    - package-ecosystem: 'composer'
      directory: '/vendor-bin/danger-php'
      schedule:
          interval: 'monthly'
          time: '06:00'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 7
          semver-major-days: 30
      reviewers:
          - 'shopware/product-cc-after-sales'
      commit-message:
          prefix: 'chore'
      groups:
          danger:
              patterns:
                  - '*'

    - package-ecosystem: 'npm'
      directory: '/tests/acceptance'
      schedule:
          interval: 'monthly'
          time: '06:00'
          timezone: 'Europe/Berlin'
      cooldown:
          default-days: 7
          semver-major-days: 30
      allow:
          - dependency-type: 'production'
      reviewers:
          - 'shopware/product-cc-after-sales'
      commit-message:
          prefix: 'chore'
      groups:
          acceptance:
              patterns:
                  - '*'
